[workspace]
members = ["src/clearing", "src/minter", "src/registry", "src/shared"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"

[workspace.dependencies]
candid = "0.10"
clearing = { path = "src/clearing" }
registry = { path = "src/registry" }
minter = { path = "src/minter" }
shared = { path = "src/shared" }
serde = { version = "1.0", features = ["derive"] }
icrc-ledger-types = "0.1"
sha2 = "0.10"
serde_bytes = "0.11"
hex = "0.4"
ic-cdk = "0.17"
num-traits = "0.2.19"
ic-cdk-macros = "0.17"
ic-cdk-timers = "0.10"

[workspace.lints.rust]
warnings = "deny"
unused_attributes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
