[workspace]
members = ["src/clearing", "src/registry", "src/shared"]
resolver = "2"

[workspace.dependencies]
candid = "0.10"
clearing = { path = "src/clearing" }
registry = { path = "src/registry" }
shared = { path = "src/shared" }
serde = { version = "1.0", features = ["derive"] }
icrc-ledger-types = "0.1"
sha2 = "0.10"
serde_bytes = "0.11"
hex = "0.4"
ic-cdk = "0.19"
num-traits = "0.2.19"
ic-cdk-macros = "0.17"
