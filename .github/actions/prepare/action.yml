name: Prepare

description: Checkout and install dependencies

inputs:
  lint-tools:
    description: Install the formatting and lint tools (shfmt, cargo-binstall, cargo-sort, zizmor, yq). Jobs that only build and test can skip them.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
      with:
        node-version-file: '.node-version'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install rust
      shell: bash
      run: scripts/setup rust

    - name: Install shfmt
      if: inputs.lint-tools == 'true'
      shell: bash
      run: scripts/setup shfmt

    - name: Install binstall
      if: inputs.lint-tools == 'true'
      shell: bash
      run: scripts/setup cargo-binstall

    - name: Install cargo dependency sorter
      if: inputs.lint-tools == 'true'
      shell: bash
      run: cargo binstall --no-confirm cargo-sort@1.0.9

    - name: Install zizmor
      if: inputs.lint-tools == 'true'
      shell: bash
      run: scripts/setup zizmor

    - name: Install yq
      if: inputs.lint-tools == 'true'
      shell: bash
      run: scripts/setup yq
