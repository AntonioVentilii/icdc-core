name: Release

on:
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

jobs:
  wasm:
    name: Build WASM
    runs-on: ubuntu-24.04
    concurrency:
      group: release-wasm-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        run: npm run build

      - name: Upload clearing.wasm.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearing.wasm.gz
          path: ./target/wasm32-unknown-unknown/release/clearing.wasm.gz

      - name: Upload registry.wasm.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry.wasm.gz
          path: ./target/wasm32-unknown-unknown/release/registry.wasm.gz

      - name: Upload minter.wasm.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minter.wasm.gz
          path: ./target/wasm32-unknown-unknown/release/minter.wasm.gz

      - name: Gzip external WASMs
        run: |
          gzip -c target/ic/ledger.wasm > target/ic/ledger.wasm.gz
          gzip -c target/ic/index.wasm > target/ic/index.wasm.gz

      - name: Upload ledger.wasm.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger.wasm.gz
          path: ./target/ic/ledger.wasm.gz

      - name: Upload index.wasm.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index.wasm.gz
          path: ./target/ic/index.wasm.gz

      - name: Upload ledger.did
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger.did
          path: ./target/ic/ledger.did

      - name: Upload index.did
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index.did
          path: ./target/ic/index.did

  candid:
    name: Generate Candid
    runs-on: ubuntu-24.04
    concurrency:
      group: release-candid-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: clearing.did
            target: clearing
          - name: registry.did
            target: registry
          - name: minter.did
            target: minter

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Upload ${{ matrix.name }}'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ./src/${{ matrix.target }}/${{ matrix.name }}

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Required to create/update the GitHub Release and/or upload release assets.
    needs: ['wasm', 'candid']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download clearing.wasm.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clearing.wasm.gz
          path: .

      - name: Download clearing.did
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clearing.did
          path: .

      - name: Download registry.wasm.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry.wasm.gz
          path: .

      - name: Download registry.did
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry.did
          path: .

      - name: Download minter.wasm.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minter.wasm.gz
          path: .

      - name: Download minter.did
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minter.did
          path: .

      - name: Download ledger.wasm.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledger.wasm.gz
          path: .

      - name: Download ledger.did
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledger.did
          path: .

      - name: Download index.wasm.gz
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index.wasm.gz
          path: .

      - name: Download index.did
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index.did
          path: .

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./clearing.wasm.gz
            ./clearing.did
            ./registry.wasm.gz
            ./registry.did
            ./minter.wasm.gz
            ./minter.did
            ./ledger.wasm.gz
            ./ledger.did
            ./index.wasm.gz
            ./index.did
