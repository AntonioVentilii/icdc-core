name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-pr-title-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR title check only runs for pull_request events."

      - name: Validate Conventional Commit PR title (scope required)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Scope is REQUIRED: type(scope): description — or type(scope)!: … for a breaking change.
          pattern='^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK."
            exit 0
          fi

          # Keep the title off the start of a line so it can't inject a ::workflow:: command.
          echo "::error::PR title must be a Conventional Commit WITH A SCOPE: 'type(scope): description' (or 'type(scope)!: …' for a breaking change)."
          echo "::error::Scope = the affected area/crate, or a short area such as 'deps' for tooling. E.g. 'feat(clearing): add settlement guard'."
          echo "Got title: $PR_TITLE"
          exit 1

  format:
    name: Format
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-format-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Required to push formatting/lint fixes back to the repo (add-and-commit).

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Format
        run: npm run format

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail for formatting issues without personal access token
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "Formatting changes are needed but couldn't be committed because the personal access token isn't available or this isn't a pull request."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-lint-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore cargo cache
        id: cache-lint
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-lint-

      - name: Lint
        run: npm run lint

      - name: Save cargo cache
        if: always() && steps.cache-lint.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-lint.outputs.cache-primary-key }}

  did:
    name: Candid
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-did-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install candid-extractor
        run: scripts/setup candid-extractor

      - name: Restore cargo cache
        id: cache-did
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-did-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-did-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-did-

      - name: Generate Candid
        run: npm run did

      - name: Check for drift
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree changed after 'npm run did'. Run it locally and commit the result."
            # Stage everything (incl. new/deleted/untracked) so the printed
            # diff shows content for all changes, not just tracked ones.
            git add -A
            git --no-pager diff --cached
            exit 1
          fi

      - name: Save cargo cache
        if: always() && steps.cache-did.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-did.outputs.cache-primary-key }}

  breaking-interface:
    name: Breaking Interface
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-breaking-interface-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Both are set from the pull_request payload and only read when the event
      # is a pull_request; on other events the guarded steps below never run.
      TITLE: ${{ github.event.pull_request.title }}
      DESCRIPTION: ${{ github.event.pull_request.body }}
      # Base commit of the PR. It is a parent of the checkout merge commit, so a
      # full-history checkout (fetch-depth: 0) always has it available locally.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Breaking-interface check only runs for pull_request events."

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Need the base commit in local history to diff the candid interface.
          fetch-depth: 0

      - name: Detect candid interface changes
        if: github.event_name == 'pull_request'
        id: did-changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            did:
              - 'src/**/*.did'

      - name: Check whether the PR declares a breaking change
        if: github.event_name == 'pull_request'
        id: declaration
        run: |
          # See https://www.conventionalcommits.org/en/v1.0.0/#commit-message-with-both--and-breaking-change-footer
          # Title needs a '!' before the colon, e.g.  feat(clearing)!: change the settlement API
          if [[ "$TITLE" =~ ^([a-z]+)(\([^\)]+\))?\!: ]]; then
            echo "BREAKING_TITLE=true" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Body needs a footer line, e.g.  BREAKING CHANGE: the settlement API is now incompatible
          if grep -qE '^BREAKING[ -]CHANGE: ' <<<"$DESCRIPTION"; then
            echo "BREAKING_DESCRIPTION=true" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decide whether to enforce compatibility
        # Enforce when the interface changed but the PR is NOT fully marked as a
        # breaking change (requires BOTH the title '!' and a body footer). A PR
        # that declares both is exempt: it has acknowledged the breakage. The
        # condition lives in `if:` (GitHub expression context, not shell) so no
        # untrusted value is expanded into a run block.
        if: >-
          github.event_name == 'pull_request'
          && steps.did-changes.outputs.did == 'true'
          && !(steps.declaration.outputs.BREAKING_TITLE == 'true' && steps.declaration.outputs.BREAKING_DESCRIPTION == 'true')
        id: gate
        run: echo "ENFORCE=true" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install didc
        if: steps.gate.outputs.ENFORCE == 'true'
        run: scripts/setup didc

      - name: Check candid backward-compatibility against the base branch
        if: steps.gate.outputs.ENFORCE == 'true'
        run: scripts/check.did.compat.sh "$BASE_SHA"

  checks-pass:
    name: Checks Pass
    if: always()
    needs: ['pr-title', 'format', 'lint', 'did', 'breaking-interface']
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-pass-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
