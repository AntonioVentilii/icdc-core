name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-pr-title-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}

    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR title check only runs for pull_request events."

      - name: Validate Conventional Commit PR title (scope required)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Scope is REQUIRED: type(scope): description — or type(scope)!: … for a breaking change.
          pattern='^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK."
            exit 0
          fi

          # Keep the title off the start of a line so it can't inject a ::workflow:: command.
          echo "::error::PR title must be a Conventional Commit WITH A SCOPE: 'type(scope): description' (or 'type(scope)!: …' for a breaking change)."
          echo "::error::Scope = the affected area/crate, or a short area such as 'deps' for tooling. E.g. 'feat(clearing): add settlement guard'."
          echo "Got title: $PR_TITLE"
          exit 1

  format:
    name: Format
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-format-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Required to push formatting/lint fixes back to the repo (add-and-commit).

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Format
        run: npm run format

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail for formatting issues without personal access token
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "Formatting changes are needed but couldn't be committed because the personal access token isn't available or this isn't a pull request."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-lint-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore cargo cache
        id: cache-lint
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-lint-

      - name: Lint
        run: npm run lint

      - name: Save cargo cache
        if: always() && steps.cache-lint.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-lint.outputs.cache-primary-key }}

  checks-pass:
    name: Checks Pass
    if: always()
    needs: ['pr-title', 'format', 'lint']
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-pass-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
