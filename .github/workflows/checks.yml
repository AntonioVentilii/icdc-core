name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-format-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Required to push formatting/lint fixes back to the repo (add-and-commit).

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Format
        run: npm run format

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail for formatting issues without personal access token
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "Formatting changes are needed but couldn't be committed because the personal access token isn't available or this isn't a pull request."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-lint-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Lint
        run: npm run lint

  did:
    name: Candid
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-did-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check Rust changes
        id: changes
        uses: ./.github/actions/check-rust-changes

      - name: Prepare
        if: steps.changes.outputs.rust == 'true'
        uses: ./.github/actions/prepare

      - name: Install candid-extractor
        if: steps.changes.outputs.rust == 'true'
        run: scripts/setup candid-extractor

      - name: Restore cargo cache
        if: steps.changes.outputs.rust == 'true'
        id: cache-did
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-did-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-did-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-did-

      # did.sh + format, not `npm run did`, whose trailing `npm run lint` is
      # redundant with the lint job. Format is required: the committed .did
      # files are prettier-formatted.
      - name: Generate Candid
        if: steps.changes.outputs.rust == 'true'
        run: |
          ./scripts/did.sh
          npm run format

      - name: Check for drift
        if: steps.changes.outputs.rust == 'true'
        run: |
          if [[ -n "$(git status --porcelain -- '*.did')" ]]; then
            echo "::error::Candid (.did) files are out of date. Run 'npm run did' locally and commit the result."
            git diff -- '*.did'
            exit 1
          fi

      - name: Save cargo cache
        if: always() && steps.changes.outputs.rust == 'true' && steps.cache-did.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-did.outputs.cache-primary-key }}

  checks-pass:
    name: Checks Pass
    if: always()
    needs: ['format', 'lint', 'did']
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-pass-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
