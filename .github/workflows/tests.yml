name: Tests

on:
  push:

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused on a fresh runner and only bloat
  # the cached `target/`.
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    concurrency:
      group: tests-unit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check Rust changes
        id: changes
        uses: ./.github/actions/check-rust-changes

      - name: Prepare
        if: steps.changes.outputs.rust == 'true'
        uses: ./.github/actions/prepare
        with:
          lint-tools: 'false'

      # Unit tests don't depend on built wasms or downloaded canister
      # binaries. The key is derived from the lockfile and toolchain only,
      # and the cache is saved from `main` only: branches can read `main`'s
      # caches but not each other's, so saving per commit or per branch just
      # evicts the useful entries from the 10 GB repo quota.
      - name: Restore cargo cache
        if: steps.changes.outputs.rust == 'true'
        id: cache-unit
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-unit-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-unit-

      - name: Run tests
        if: steps.changes.outputs.rust == 'true'
        run: npm run test:unit

      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.rust == 'true' && steps.cache-unit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-unit.outputs.cache-primary-key }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    concurrency:
      group: tests-integration-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check Rust changes
        id: changes
        uses: ./.github/actions/check-rust-changes

      - name: Prepare
        if: steps.changes.outputs.rust == 'true'
        uses: ./.github/actions/prepare
        with:
          lint-tools: 'false'

      # Integration tests use both the workspace wasms (built into
      # `target/wasm32-unknown-unknown/release/`) and the downloaded
      # third-party canisters (extracted into `target/ic/`). Both live
      # under `target/`, so caching it skips both rebuild and redownload.
      # Keyed and saved like the unit cache: inputs only, `main` only.
      - name: Restore cargo cache
        if: steps.changes.outputs.rust == 'true'
        id: cache-integration
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-integration-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/build.sh', 'scripts/download.ledger.sh', 'scripts/download.icp.sh', 'scripts/download-immutable.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-integration-

      - name: Build
        if: steps.changes.outputs.rust == 'true'
        run: npm run build

      - name: Run tests
        if: steps.changes.outputs.rust == 'true'
        run: npm run test:integration

      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.rust == 'true' && steps.cache-integration.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-integration.outputs.cache-primary-key }}

  tests-pass:
    name: Tests Pass
    needs: ['unit', 'integration']
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: tests-pass-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
