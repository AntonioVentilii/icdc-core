name: PR Checks

# Squash-merge PR titles become the Conventional Commit messages that
# release-please parses to build the changelog and pick the next version, so the
# title must be a valid Conventional Commit. Scope is optional.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-checks-title-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|deps|revert|refactor|docs|build|ci|test|style|chore)(\([-a-zA-Z0-9_,/ ]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: '$PR_TITLE'"
          else
            echo "::error::PR title is not a valid Conventional Commit: '$PR_TITLE'"
            echo "Expected: <type>[(scope)][!]: <description>"
            echo "Types: feat, fix, perf, deps, revert, refactor, docs, build, ci, test, style, chore"
            exit 1
          fi
